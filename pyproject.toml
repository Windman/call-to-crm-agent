[project]
name = "call-to-crm-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Max", email = "maxkvt@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.3.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
call-to-crm-agent = "call_to_crm_agent:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
