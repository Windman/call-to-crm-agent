[project]
name = "call-to-crm-agent"
version = "0.1.0"
description = "LLM agent that turns call transcripts into CRM contacts, notes and follow-up tasks"
readme = "README.md"
authors = [
    { name = "Max", email = "maxkvt@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.3.0",
    "httpx>=0.28.1",
    "phonenumbers>=9.0.42",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.6",
]

[project.scripts]
call-to-crm-agent = "call_to_crm_agent:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
